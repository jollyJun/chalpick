<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찰픽 — 검색</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --surface-0:#E9ECF1; --surface-1:#FFFFFF; --surface-2:#F7F9FC;
  --border:#E3E8EF; --border-strong:#CDD5E0; --border-accent:#F2C9A0;
  --text-primary:#1A2330; --text-secondary:#5A6675; --text-muted:#8A94A3;
  --text-accent:#C77D3A; --text-success:#2E8B57; --text-warning:#2F7DB3;
  --text-danger:#7A5CB0; --text-neutral:#7A5CB0;
  --bg-accent:#FBEFE2; --bg-success:#E4F2EA; --bg-warning:#E2EFF8; --bg-neutral:#EDE7F5;
}
html[data-theme="dark"]{
  --surface-0:#0F1620; --surface-1:#141C28; --surface-2:#1B2530;
  --border:#2A3746; --border-strong:#3A4A5C; --border-accent:#6E4A2A;
  --text-primary:#EAF0F7; --text-secondary:#A9B6C6; --text-muted:#6E7B8C;
  --text-accent:#E0A45C; --text-success:#4FB37A; --text-warning:#5AA9DE;
  --text-danger:#A98BDD; --text-neutral:#A98BDD;
  --bg-accent:#3A2A1A; --bg-success:#1E3A2A; --bg-warning:#16324A; --bg-neutral:#2A2440;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-2);color:var(--text-primary);
 font-family:"Pretendard Variable",Pretendard,-apple-system,'Noto Sans KR',sans-serif;
 font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 64px}

header{background:var(--surface-1);border-bottom:.5px solid var(--border);position:sticky;top:0;z-index:20}
.hd{max-width:1160px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:14px}
.logo{font-size:19px;font-weight:800;letter-spacing:-.03em}
.logo em{font-style:normal;color:var(--text-accent)}
.hd nav{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text-secondary)}
.hd nav a{color:inherit;text-decoration:none}
.hd nav a:hover{color:var(--text-primary)}
.tglbtn{border:1px solid var(--border-strong);background:var(--surface-1);
 color:var(--text-secondary);border-radius:7px;padding:4px 9px;font-size:11px}

/* 취향 시점 — 자유검색 위 */
.lens{display:flex;align-items:center;gap:9px;margin-top:16px;padding:13px 16px;
 background:var(--surface-1);border:.5px solid var(--border-accent);
 border-radius:14px 14px 0 0;border-bottom:none;flex-wrap:wrap}
.lens .lb{font-size:11px;color:var(--text-muted)}
.lensbtn{border:.5px solid var(--border);background:transparent;border-radius:999px;
 padding:7px 15px;font-size:13px;font-weight:500;color:var(--text-muted);
 display:flex;align-items:center;gap:7px}
.lensbtn[aria-pressed="true"].cat{background:var(--bg-accent);color:var(--text-accent);border-color:var(--bg-accent)}
.lensbtn[aria-pressed="true"].dol{background:var(--bg-warning);color:var(--text-warning);border-color:var(--bg-warning)}
.lens .note{font-size:11px;color:var(--text-muted);margin-left:auto}

.searchbox{background:var(--surface-1);border:.5px solid var(--border);
 border-radius:0 0 14px 14px;overflow:hidden}
.freebar{display:flex;gap:9px;align-items:center;padding:14px 16px;border-bottom:.5px solid var(--border);
 border-top:.5px solid var(--border)}
.freebar input{flex:1;border:none;outline:none;background:transparent;font-size:15px;
 color:var(--text-primary);font-family:inherit}
.freebar input::placeholder{color:var(--text-muted)}
.freebar .ico{color:var(--text-muted);font-size:16px}

.tabs{display:flex;gap:2px;padding:10px 16px 0}
.tab{border:none;background:transparent;padding:7px 13px;border-radius:8px 8px 0 0;
 font-size:13px;font-weight:500;color:var(--text-muted)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--text-primary)}
.tab .n{font-size:10px;color:var(--text-muted);margin-left:4px}
.tab .dot{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;
 margin-left:5px;padding:0 4px;border-radius:999px;font-size:9.5px;font-weight:700;
 background:var(--text-accent);color:#fff}

.active{display:none;align-items:center;gap:7px;flex-wrap:wrap;
 padding:11px 16px;border-top:.5px solid var(--border);background:var(--bg-accent)}
.active.on{display:flex}
.active .lbl{font-size:11px;color:var(--text-accent);margin-right:2px}
.actchip{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;
 padding:5px 9px 5px 11px;font-size:12px;font-weight:500;
 background:var(--surface-1);color:var(--text-primary);
 box-shadow:0 0 0 .5px var(--border-accent)}
.actchip .g{font-size:10px;color:var(--text-muted)}
.actchip .x{color:var(--text-muted);font-size:13px;line-height:1}
.actchip:hover .x{color:var(--text-primary)}
.clearall{margin-left:auto;border:none;background:none;font-size:11px;
 color:var(--text-accent);text-decoration:underline}
.panel{background:var(--surface-2);padding:13px 16px 15px;border-top:.5px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:.5px solid var(--border-strong);background:var(--surface-1);
 color:var(--text-secondary);border-radius:999px;padding:5px 11px;font-size:12px}
.chip:hover{border-color:var(--text-muted)}
.chip[aria-pressed="true"]{background:var(--text-primary);border-color:var(--text-primary);color:var(--surface-1)}
.chip.dead{opacity:.3;cursor:default}
.pill.dead{opacity:.3;cursor:default}
.chip .c{font-size:10px;opacity:.6;margin-left:3px}
.more{border:none;background:none;color:var(--text-secondary);font-size:11px;padding:6px 2px;text-decoration:underline}

.filters{border-top:.5px solid var(--border);background:var(--surface-1);padding:4px 16px 12px}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:9px}
.fgroup>span.lbl{font-size:11px;color:var(--text-muted);width:44px;flex-shrink:0}
.pill{border:.5px solid var(--border-strong);background:transparent;color:var(--text-secondary);
 border-radius:7px;padding:4px 10px;font-size:12px}
.pill[aria-pressed="true"]{background:var(--surface-0);color:var(--text-primary);border-color:var(--text-muted)}
.pill .c{font-size:10px;opacity:.55;margin-left:3px}
.dedupe{margin-left:auto;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:5px}

.resbar{display:flex;align-items:baseline;gap:10px;margin:18px 0 12px;flex-wrap:wrap}
.resbar strong{font-size:15px}
.resbar .sub{font-size:11px;color:var(--text-muted)}
.sorts{margin-left:auto;display:flex;gap:4px}
.sortbtn{border:none;background:none;font-size:12px;color:var(--text-muted);padding:3px 7px;border-radius:6px}
.sortbtn[aria-pressed="true"]{color:var(--text-primary);font-weight:600;background:var(--surface-0)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 13px}
.card{background:none;border:none;padding:0;text-align:left;display:block;width:100%}
.thumb{width:100%;aspect-ratio:2/3;border-radius:9px;position:relative;overflow:hidden;
 display:flex;align-items:flex-end;padding:9px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07);
 transition:transform .16s ease}
.card:hover .thumb{transform:translateY(-3px)}
.thumb .tt{font-size:12.5px;font-weight:650;line-height:1.32;color:rgba(255,255,255,.97);
 text-shadow:0 1px 4px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:3;
 -webkit-box-orient:vertical;overflow:hidden;padding-right:16px}
.thumb .wm{position:absolute;right:8px;bottom:8px;font-size:11px;color:rgba(255,255,255,.55)}
.thumb .pct{position:absolute;left:8px;top:8px;font-size:10px;font-weight:700;padding:2px 6px;
 border-radius:6px;background:rgba(255,255,255,.9);color:#1A2330}
html[data-theme="dark"] .thumb .pct{background:rgba(20,28,40,.85);color:#EAF0F7}
.thumb .est{position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;
 background:rgba(255,255,255,.55)}
.meta{margin-top:7px}
.badge{font-size:10px;padding:1px 6px;border-radius:6px}
.b-웹툰{background:var(--bg-accent);color:var(--text-accent)}
.b-드라마{background:var(--bg-success);color:var(--text-success)}
.b-영화{background:var(--bg-neutral);color:var(--text-neutral)}
.b-웹소설{background:var(--bg-neutral);color:var(--text-neutral)}
body.teal .b-영화{background:#DCF0EF;color:#2E7A7A}
html[data-theme="dark"] body.teal .b-영화{background:#123434;color:#5FBDBB}
.meta .ti{font-size:12px;font-weight:600;margin-top:4px;line-height:1.35;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .yr{font-size:11px;color:var(--text-muted);margin-top:2px}

.state{padding:60px 20px;text-align:center;color:var(--text-muted);font-size:13px;
 background:var(--surface-1);border:.5px dashed var(--border-strong);border-radius:12px;line-height:1.7}
.state b{display:block;color:var(--text-primary);font-size:14px;margin-bottom:8px}
.state code{background:var(--surface-0);padding:2px 6px;border-radius:4px;font-size:12px}
.skel{background:var(--surface-0);border-radius:9px;aspect-ratio:2/3;
 animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.mask{position:fixed;inset:0;background:rgba(15,22,32,.45);display:none;z-index:50}
.mask.on{display:block}
.sheet{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:92vw;background:var(--surface-1);
 border-left:.5px solid var(--border);z-index:51;transform:translateX(100%);
 transition:transform .22s ease;overflow-y:auto;padding:18px}
.sheet.on{transform:none}
.sheet .x{position:absolute;right:14px;top:14px;border:none;background:none;font-size:18px;color:var(--text-muted)}
.reason{background:var(--bg-accent);border-radius:10px;padding:13px;margin-top:14px}
.reason .h{font-size:13px;font-weight:600;color:var(--text-accent);margin-bottom:8px}
.reason ul{margin:0;padding-left:16px;font-size:12px;color:var(--text-accent);line-height:1.75}
.warnbox{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:11.5px;line-height:1.6;
 background:var(--bg-neutral);color:var(--text-neutral)}

@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
  .hd nav a{display:none}
  .lens .note{width:100%;margin-left:0}
  .fgroup>span.lbl{width:100%}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo">찰<em>픽</em></div>
    <nav>
      <a href="#">로그인</a><a href="#">회원가입</a><a href="#">마이페이지</a>
      <button class="tglbtn" id="theme">다크</button>
      <button class="tglbtn" id="teal">영화 청록</button>
    </nav>
  </div>
</header>

<div class="wrap">

  <!-- ① 취향 시점 (자유검색 위) -->
  <div class="lens">
    <span class="lb">누구의 취향으로 볼까요</span>
    <button class="lensbtn cat" data-seg="S1" aria-pressed="true">🐈 느긋관찰 고양이</button>
    <button class="lensbtn dol" data-seg="S4" aria-pressed="false">🌊 사이다점프 돌고래</button>
    <span class="note">시점을 바꾸면 같은 검색 결과가 다시 정렬됩니다</span>
  </div>

  <!-- ② 검색 -->
  <div class="searchbox">
    <div class="freebar">
      <span class="ico">⌕</span>
      <input id="q" placeholder="제목, 작가, 등장인물 — 한 곳에서 검색">
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-cat="genre"  aria-selected="true">장르<span class="n" id="n-genre"></span></button>
      <button class="tab" role="tab" data-cat="world"  aria-selected="false">소재·배경<span class="n" id="n-world"></span></button>
      <button class="tab" role="tab" data-cat="people" aria-selected="false">인물·관계<span class="n" id="n-people"></span></button>
    </div>
    <div class="panel" id="panel"></div>
    <div class="active" id="active"></div>

    <div class="filters">
      <div class="fgroup" id="mediaF"><span class="lbl">유형</span></div>
      <div class="fgroup" id="platF"><span class="lbl">플랫폼</span></div>
    </div>
  </div>

  <div class="resbar">
    <strong id="cnt">—</strong>
    <span class="sub" id="subline"></span>
    <div class="sorts">
      <button class="sortbtn" data-sort="match" aria-pressed="true">취향순</button>
      <button class="sortbtn" data-sort="year"  aria-pressed="false">최신순</button>
      <button class="sortbtn" data-sort="title" aria-pressed="false">가나다순</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="mask" id="mask"></div>
<aside class="sheet" id="sheet"></aside>
<script>
/* ════════════════════════════════════════════════════════════
   ① 여기 두 줄만 채우면 됩니다
   Supabase 대시보드 → Project Settings → API Keys
   ──────────────────────────────────────────────────────────
   SUPABASE_KEY 는 publishable(sb_publishable_...) 또는
   legacy anon 키를 넣습니다. secret / service_role 키는
   절대 넣지 마세요 — RLS를 우회하고 이 파일은 공개됩니다.
   ════════════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://lzfnrqpsdtgkzzyoojsl.supabase.co";
const SUPABASE_KEY = "sb_publishable_GAI92kBGywJT6HqdR_3SzA_pvznkdEA";
/* ══════════════════════════════════════════════════════════ */

/* ── Supabase REST ──────────────────────────────────────── */
function headers(){
  const h = { apikey: SUPABASE_KEY, Accept: "application/json" };
  // 신규 sb_ 키는 apikey 헤더 전용. legacy anon(JWT)만 Authorization 필요.
  if (!SUPABASE_KEY.startsWith("sb_")) h.Authorization = "Bearer " + SUPABASE_KEY;
  return h;
}
async function rest(path){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: headers() });
  if(!res.ok) throw new Error("[" + res.status + "] " + (await res.text()).slice(0,200));
  return res.json();
}
// PostgREST 기본 페이지 한계를 넘길 수 있으므로 range 로 끊어 받는다
async function restAll(path, step = 1000){
  let out = [], from = 0;
  for(;;){
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
      headers: { ...headers(), Range: from + "-" + (from + step - 1) } });
    if(!res.ok) throw new Error("[" + res.status + "] " + (await res.text()).slice(0,200));
    const chunk = await res.json();
    out = out.concat(chunk);
    if(chunk.length < step) return out;
    from += step;
  }
}

/* ── 취향 계산 (lib/match.ts 와 동일 로직) ──────────────── */
const USERS = {
  S1:{ name:"느긋관찰 고양이", emo:"🐈", v:{tempo:40,mood:45,resolve:30,unusual:11} },
  S4:{ name:"사이다점프 돌고래", emo:"🌊", v:{tempo:44,mood:40,resolve:57,unusual:78} }
};
const AX = ["tempo","mood","resolve","unusual"];
const PRI = { unusual:0, resolve:1, mood:2, tempo:3 };
const PH = {
  tempo:{low:"느긋한 호흡으로 천천히 쌓이는", high:"몰아치는 전개로 긴장감 있는"},
  mood:{low:"밝고 유쾌하게 즐기는", high:"묵직하고 진한 정서의"},
  resolve:{low:"여운이 길게 남는", high:"속 시원하게 풀리는"},
  unusual:{low:"우리 일상 옆에 있을 법한 이야기", high:"현실과 먼 완전히 다른 세계의 이야기"}
};
/* 4축 등가중 유클리드 거리 — 정렬의 기준값(연속) */
const distance = (u,w) => Math.sqrt(AX.reduce((s,a)=>s+(u[a]-w[a])**2,0));
/* 화면 표시용 정수 매치율. 200 = sqrt(4*100^2)
   ※ 정렬에는 쓰지 않는다. 반올림하면 436편이 50단계로 뭉개져 동점이 대량 발생한다. */
const match = (u,w) => Math.round((1 - distance(u,w)/200)*100);
function reasons(u,w){
  const c = AX.map(a=>({a, d:Math.abs(u[a]-w[a]), v:w[a]}))
              .filter(x=>x.d<=20)
              .sort((x,y)=>x.d-y.d || PRI[x.a]-PRI[y.a]);
  const out=[];
  for(const x of c){ if(x.v<45) out.push(PH[x.a].low); else if(x.v>55) out.push(PH[x.a].high); }
  const t = out.slice(0,3);
  return t.length<2 ? {lines:["네 취향과 여러 결이 두루 맞는 작품"], fb:true} : {lines:t, fb:false};
}
function grad(w){
  const h = ((30 - (w.unusual/100)*125) % 360 + 360) % 360;
  const dark = document.documentElement.dataset.theme === "dark";
  const s = dark?38:46, l = dark ? 52-(w.mood/100)*26 : 76-(w.mood/100)*34;
  return `linear-gradient(148deg,hsl(${(h+12)%360} ${s}% ${l+9}%),hsl(${((h-16)%360+360)%360} ${s}% ${l-11}%))`;
}
const MEDIA_ICON = {"웹툰":"▤","드라마":"▶","영화":"▣","웹소설":"❝"};
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── 상태 ───────────────────────────────────────────────── */
let DB = { works:[], tags:[] };
let ST = { cat:"genre", tags:new Set(), media:new Set(), plat:new Set(),
           seg:"S1", sort:"match", q:"", expand:false, dedupe:true };
let TAGCOUNT = {}, MEDIACOUNT = {}, PLATCOUNT = {}, PLATFORMS = [], TAGORDER = {};

/* ── 로드 ───────────────────────────────────────────────── */
async function load(){
  const g = document.getElementById("grid");
  g.style.display = "grid";
  g.innerHTML = Array.from({length:12}, () => '<div class="skel"></div>').join("");

  if(SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_KEY.startsWith("YOUR_")){
    return fail("연결 정보가 비어 있습니다",
      "이 파일 <code>&lt;script&gt;</code> 첫 부분의 <code>SUPABASE_URL</code> 과 " +
      "<code>SUPABASE_KEY</code> 를 채우고 새로고침하세요.");
  }
  try{
    const [tags, works] = await Promise.all([
      restAll("tags?select=slug,name,category,sort_order&order=sort_order"),
      restAll("contents?select=id,title,media,platforms,tempo,mood,resolve,unusual," +
              "tier,year,confidence,is_anchor,analysis_note,content_tags(tag_slug)&order=id")
    ]);
    DB.tags  = tags;
    DB.works = works.map(w => ({ ...w, tags:(w.content_tags||[]).map(t=>t.tag_slug) }));
    DB.tags.forEach((t,i) => TAGORDER[t.slug] = t.sort_order ?? i);
    // 전체 플랫폼 목록은 한 번만 확정 (필터로 사라지지 않도록)
    PLATFORMS = [...new Set(DB.works.flatMap(w => w.platforms||[]))];
    render();
  }catch(e){
    fail("데이터를 불러오지 못했습니다", esc(e.message) +
      "<br><br>확인할 것 — ① URL·키 오타 ② tags·contents·content_tags 에 " +
      "SELECT 정책이 있는지 ③ <code>file://</code> 로 열었다면 로컬 서버로 여세요 " +
      "(<code>npx serve .</code>)");
  }
}
function fail(t, msg){
  const g = document.getElementById("grid");
  g.style.display = "block";
  g.innerHTML = `<div class="state"><b>${t}</b>${msg}</div>`;
  document.getElementById("cnt").textContent = "—";
}

/* ── 필터 ───────────────────────────────────────────────────
   skip 에 넣은 그룹은 무시하고 거른다.
   · 태그는 AND 조합 → 자기 그룹도 그대로 적용해야
     "로맨스 + 로코 = 0" 이 카운트에 드러난다.
   · 유형·플랫폼은 그룹 내부가 OR → 자기 그룹을 빼고 세어야
     하나를 고른 뒤에도 나머지를 추가로 켤 수 있다.
   ─────────────────────────────────────────────────────────── */
function filtered(skip){
  skip = skip || "";
  const q = ST.q.trim();
  return DB.works.filter(w => {
    if(ST.dedupe && w.title.endsWith("(소설)")) return false;
    if(q && !w.title.includes(q)) return false;
    if(skip !== "tags"  && ST.tags.size && ![...ST.tags].every(t => w.tags.includes(t))) return false;
    if(skip !== "media" && ST.media.size && !ST.media.has(w.media)) return false;
    if(skip !== "plat"  && ST.plat.size && !(w.platforms||[]).some(p => ST.plat.has(p))) return false;
    return true;
  });
}

/* ── 패싯 카운트 ────────────────────────────────────────── */
function computeFacets(){
  TAGCOUNT = {}; MEDIACOUNT = {}; PLATCOUNT = {};
  for(const w of filtered())        w.tags.forEach(t => TAGCOUNT[t] = (TAGCOUNT[t]||0)+1);
  for(const w of filtered("media")) MEDIACOUNT[w.media] = (MEDIACOUNT[w.media]||0)+1;
  for(const w of filtered("plat"))  (w.platforms||[]).forEach(p => PLATCOUNT[p] = (PLATCOUNT[p]||0)+1);
}
// 선택된 것 먼저 → 개수 많은 순 → 원래 순서
function facetSort(items, key, counts, selected, order){
  return [...items].sort((a,b) => {
    const ka = key(a), kb = key(b);
    const sa = selected.has(ka) ? 0 : 1, sb = selected.has(kb) ? 0 : 1;
    if(sa !== sb) return sa - sb;
    const ca = counts[ka]||0, cb = counts[kb]||0;
    if(ca !== cb) return cb - ca;
    return (order ? order(a) - order(b) : 0);
  });
}

/* ── 렌더 ───────────────────────────────────────────────── */
function render(){
  computeFacets();
  renderTabCounts();
  renderPanel();
  renderActive();
  renderFilters();
  renderGrid();
}

/* 지금 걸려 있는 조건을 항상 보여준다.
   태그가 3개 탭에 흩어져 있어 다른 탭 선택이 화면에서 사라지는 문제를 막는다. */
function renderActive(){
  const host = document.getElementById("active");
  const items = [
    ...[...ST.tags].map(s => {
      const t = DB.tags.find(x=>x.slug===s) || {};
      const g = {genre:"장르", world:"소재·배경", people:"인물·관계"}[t.category] || "";
      return { key:"tags", val:s, label:t.name || s, group:g };
    }),
    ...[...ST.media].map(v => ({ key:"media", val:v, label:v, group:"유형" })),
    ...[...ST.plat].map(v  => ({ key:"plat",  val:v, label:v, group:"플랫폼" })),
  ];
  if(ST.q.trim()) items.unshift({ key:"q", val:"", label:'"'+ST.q.trim()+'"', group:"검색어" });

  if(!items.length){ host.className = "active"; host.innerHTML = ""; return; }
  host.className = "active on";
  host.innerHTML = `<span class="lbl">적용 중</span>` +
    items.map((it,i) => `<button class="actchip" data-i="${i}">
      <span class="g">${esc(it.group)}</span>${esc(it.label)}<span class="x">✕</span></button>`).join("") +
    `<button class="clearall" id="clearall">전체 해제</button>`;

  host.querySelectorAll(".actchip").forEach(b => b.onclick = () => {
    const it = items[+b.dataset.i];
    if(it.key === "q"){ ST.q = ""; document.getElementById("q").value = ""; }
    else ST[it.key].delete(it.val);
    render();
  });
  document.getElementById("clearall").onclick = () => {
    ST.tags.clear(); ST.media.clear(); ST.plat.clear();
    ST.q = ""; document.getElementById("q").value = "";
    render();
  };
}

function renderTabCounts(){
  for(const c of ["genre","world","people"]){
    const list = DB.tags.filter(t=>t.category===c);
    const live = list.filter(t=>(TAGCOUNT[t.slug]||0)>0).length;
    const on   = list.filter(t=>ST.tags.has(t.slug)).length;
    const el = document.getElementById("n-"+c);
    el.textContent = live + "/" + list.length;
    const tab = el.closest(".tab");
    tab.querySelectorAll(".dot").forEach(d=>d.remove());
    if(on){
      const d = document.createElement("span");
      d.className = "dot"; d.textContent = on;
      d.title = "이 탭에서 선택한 태그 " + on + "개";
      tab.appendChild(d);
    }
  }
}

function renderPanel(){
  const list = facetSort(
    DB.tags.filter(t=>t.category===ST.cat),
    t => t.slug, TAGCOUNT, ST.tags, t => TAGORDER[t.slug]);
  const shown = ST.expand ? list : list.slice(0,18);
  const p = document.getElementById("panel");
  p.innerHTML = `<div class="chips">` + shown.map(t=>{
      const n = TAGCOUNT[t.slug]||0, on = ST.tags.has(t.slug);
      const dead = n===0 && !on;
      return `<button class="chip${dead?" dead":""}" data-tag="${esc(t.slug)}"
        aria-pressed="${on}"${dead?" disabled":""}>${esc(t.name)}<span class="c">${n}</span></button>`;
    }).join("") + `</div>` +
    (list.length>18 ? `<button class="more" id="more">${
      ST.expand ? "접기"
                : "더보기 +" + (list.length-18) +
                  (list.filter(t=>(TAGCOUNT[t.slug]||0)===0).length
                    ? " (결과 없는 태그 " + list.filter(t=>(TAGCOUNT[t.slug]||0)===0).length + "개 포함)" : "")
    }</button>` : "");

  p.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const s = b.dataset.tag;
    ST.tags.has(s) ? ST.tags.delete(s) : ST.tags.add(s);
    render();
  });
  const m = document.getElementById("more");
  if(m) m.onclick = () => { ST.expand = !ST.expand; renderPanel(); };
}

function renderFilters(){
  const build = (host, items, key, counts) => {
    host.querySelectorAll(".pill,.dedupe").forEach(e=>e.remove());
    facetSort(items, v=>v, counts, ST[key], null).forEach(v => {
      const n = counts[v]||0, on = ST[key].has(v);
      const b = document.createElement("button");
      b.className = "pill" + (n===0 && !on ? " dead" : "");
      b.innerHTML = esc(v) + `<span class="c">${n}</span>`;
      b.setAttribute("aria-pressed", on);
      if(n===0 && !on) b.disabled = true;
      b.onclick = () => { on ? ST[key].delete(v) : ST[key].add(v); render(); };
      host.appendChild(b);
    });
  };
  build(document.getElementById("mediaF"), ["웹툰","웹소설","영화","드라마"], "media", MEDIACOUNT);
  build(document.getElementById("platF"), PLATFORMS, "plat", PLATCOUNT);

  const d = document.createElement("label");
  d.className = "dedupe";
  d.innerHTML = `<input type="checkbox" id="dd" ${ST.dedupe?"checked":""}> 동일 IP 중복판 숨기기`;
  document.getElementById("platF").appendChild(d);
  d.querySelector("#dd").onchange = e => { ST.dedupe = e.target.checked; render(); };
}

function renderGrid(){
  const u = USERS[ST.seg].v;
  const yr = w => parseInt(String(w.year).slice(0,4), 10) || 0;   // '2019경' → 2019
  let list = filtered().map(w => ({...w, d: distance(u,w), pct: match(u,w)}));

  // 취향순: 반올림된 %가 아니라 실수 거리로 정렬한다(오름차순 = 가까운 순)
  if(ST.sort==="match") list.sort((a,b)=> a.d - b.d || a.title.localeCompare(b.title,"ko"));
  // 최신순: 연도 숫자 내림차순, 같은 해면 취향이 가까운 순
  if(ST.sort==="year")  list.sort((a,b)=> yr(b) - yr(a) || a.d - b.d);
  if(ST.sort==="title") list.sort((a,b)=> a.title.localeCompare(b.title,"ko"));

  document.getElementById("cnt").textContent = list.length + "편";
  const names = [...ST.tags].map(s => (DB.tags.find(t=>t.slug===s)||{}).name).filter(Boolean);
  const fl = [...ST.media, ...ST.plat];
  document.getElementById("subline").textContent =
    [names.join(" + ") || "전체", fl.join("·")].filter(Boolean).join(" · ") + " · " +
    ({match:USERS[ST.seg].name+" 취향순", year:"최신순", title:"가나다순"})[ST.sort];

  const g = document.getElementById("grid");
  if(!list.length){
    g.style.display="block";
    g.innerHTML = `<div class="state"><b>조건에 맞는 작품이 없습니다</b>
      태그를 하나 줄이거나 유형·플랫폼 필터를 풀어보세요.</div>`;
    return;
  }
  g.style.display="grid";
  g.innerHTML = list.map(w => `
    <button class="card" data-id="${w.id}">
      <div class="thumb" style="background:${grad(w)}">
        ${ST.sort==="match" ? `<span class="pct">${w.pct}%</span>` : ""}
        ${w.confidence==="추정" ? `<span class="est" title="추정 점수"></span>` : ""}
        <span class="tt">${esc(w.title)}</span><span class="wm">${MEDIA_ICON[w.media]||""}</span>
      </div>
      <div class="meta">
        <span class="badge b-${esc(w.media)}">${esc(w.media)}</span>
        <div class="ti">${esc(w.title)}</div>
        <div class="yr">${esc(w.year)} · ${esc((w.platforms||[])[0]||"")}</div>
      </div>
    </button>`).join("");
  g.querySelectorAll(".card").forEach(b => b.onclick = () => openSheet(+b.dataset.id));
}

/* ── 상세 시트 ──────────────────────────────────────────── */
function openSheet(id){
  const w = DB.works.find(x=>x.id===id), u = USERS[ST.seg];
  const pct = match(u.v,w), r = reasons(u.v,w);
  document.getElementById("sheet").innerHTML = `
    <button class="x" id="closeS">✕</button>
    <div style="width:120px;aspect-ratio:2/3;border-radius:10px;background:${grad(w)};
      display:flex;align-items:flex-end;padding:10px;margin-bottom:14px">
      <span style="font-size:13px;font-weight:650;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)">${esc(w.title)}</span>
    </div>
    <span class="badge b-${esc(w.media)}">${esc(w.media)}</span>
    <div style="font-size:18px;font-weight:600;margin:7px 0 3px">${esc(w.title)}</div>
    <div style="font-size:12px;color:var(--text-muted)">
      ${esc(w.year)} · ${esc((w.platforms||[]).join(", "))}
    </div>
    <div style="margin-top:11px;display:flex;flex-wrap:wrap;gap:5px">
      ${w.tags.map(s=>{const t=DB.tags.find(x=>x.slug===s);
        return `<span class="chip" style="pointer-events:none">${esc(t?t.name:s)}</span>`;}).join("")}
    </div>
    <div class="reason">
      <div class="h">${u.emo} ${u.name}인 너와 ${pct}% 일치</div>
      ${r.fb ? `<div style="font-size:12px;color:var(--text-accent)">${r.lines[0]}</div>`
             : `<ul>${r.lines.map(l=>`<li>${l}</li>`).join("")}</ul>`}
    </div>
    ${pct<75 ? `<div class="warnbox"><b>⚠ 개발 노트</b><br>
      매치율 ${pct}% 인데 근거 블록이 "잘 맞는 이유"를 그대로 출력합니다.
      R3 알고리즘이 매치율을 보지 않기 때문입니다. 게이트 필요.</div>` : ""}
`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("mask").classList.add("on");
  document.getElementById("closeS").onclick = closeSheet;
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("mask").classList.remove("on");
}

/* ── 이벤트 ─────────────────────────────────────────────── */
document.getElementById("mask").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===b));
  ST.cat = b.dataset.cat; ST.expand = false; renderPanel();
});
document.querySelectorAll(".lensbtn").forEach(b => b.onclick = () => {
  document.querySelectorAll(".lensbtn").forEach(x=>x.setAttribute("aria-pressed", x===b));
  ST.seg = b.dataset.seg; renderGrid();
});
document.querySelectorAll(".sortbtn").forEach(b => b.onclick = () => {
  document.querySelectorAll(".sortbtn").forEach(x=>x.setAttribute("aria-pressed", x===b));
  ST.sort = b.dataset.sort; renderGrid();
});
document.getElementById("q").oninput = e => { ST.q = e.target.value; render(); };
document.getElementById("q").addEventListener("keydown", e => {
  if(e.key === "Escape"){ ST.q = ""; e.target.value = ""; render(); }
});
document.getElementById("theme").onclick = e => {
  const d = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = d ? "light" : "dark";
  e.target.textContent = d ? "다크" : "라이트";
  if(DB.works.length) render();
};
document.getElementById("teal").onclick = e => {
  document.body.classList.toggle("teal");
  e.target.textContent = document.body.classList.contains("teal") ? "영화 보라" : "영화 청록";
};

load();
</script>
